name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure ripgrep is available
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Join-Path $env:ChocolateyInstall 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - run: rg --version
      - run: npm audit --audit-level=moderate
      - run: npm run doctor
      - run: npm run check
      - run: npm test
      - run: npm run verify:surface
      - run: npm run verify:agent
      - run: npm run verify:parity
      - run: npm run verify:oauth
      - run: npm run verify:oauth:security
      - name: Ensure Playwright browser is available
        shell: pwsh
        run: |
          node --input-type=module -e "import { resolveBrowserLaunchOptions } from './scripts/browser-lib.mjs'; try { await resolveBrowserLaunchOptions(); } catch { const { execSync } = await import('node:child_process'); execSync('npx playwright-core install chromium', { stdio: 'inherit' }); }"
      - run: npm run test:browser
      - run: npm run audit:public
